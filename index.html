<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<title>Prodrome Rising</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0716">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Prodrome Rising">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-180.png"><link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Orbitron:wght@700;900&display=swap">
<style>
:root{--bg:#0b0716;--panel:#171027;--panel2:#221838;--fg:#efe9ff;--dim:#9c8fc0;--pink:#ff4fb8;--cyan:#37e0ff;--lime:#b6ff5c;--line:#3a2a63;color-scheme:dark;
--ui:'Chakra Petch',system-ui,sans-serif;--disp:'Orbitron','Chakra Petch',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:none}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--fg);font:500 14px/1.35 var(--ui)}
#app{height:100%;display:flex;flex-direction:column;justify-content:center;position:relative;max-width:900px;margin:0 auto}
#stage{position:relative;width:100%;aspect-ratio:16/9;max-height:62%;flex:none;background:#000;margin:0 auto;overflow:hidden;border-bottom:2px solid var(--line)}
#cv{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.45))}
#hud{position:absolute;inset:0;pointer-events:none;z-index:2}
#toast,#tip{position:absolute;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:1px;text-align:center;background:rgba(11,7,22,.85);border:1px solid var(--line);padding:4px 10px;font-size:11px;max-width:92%;line-height:1.25}
#toast{bottom:8%}#tip{top:44%}
#toast b,#tip b{font-family:var(--disp);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
#toast span,#tip span{color:var(--dim)}
#toast.in{animation:pop .25s ease-out}
@keyframes pop{from{transform:translate(-50%,8px);opacity:0}}
#banner{position:absolute;top:30%;left:0;right:0;text-align:center;font:900 clamp(14px,4.5vw,28px)/1.1 var(--disp);color:var(--pink);text-shadow:0 0 12px var(--pink),0 0 2px #fff;letter-spacing:.08em;text-transform:uppercase;padding:0 12px}
.bar{position:absolute;bottom:4px;right:4px;display:flex;gap:4px;z-index:3}
.bar button{pointer-events:auto;width:30px;height:30px;border:1px solid var(--line);background:rgba(11,7,22,.7);color:var(--fg);font:700 14px var(--ui);padding:0}
/* contrôles */
#ctl{position:absolute;inset:0;display:none;pointer-events:none}
body.touch #ctl{display:block}
#kbhint{flex:none;padding-top:12px!important;display:flex;align-items:center;justify-content:center;color:var(--dim);text-align:center;padding:0 16px;font-size:13px}
body.touch #kbhint{display:none}
.pad{position:absolute;display:flex;gap:10px;pointer-events:auto}
#padL{left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px))}
#padR{right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));flex-wrap:wrap;justify-content:flex-end;width:236px;gap:8px}
.b{width:68px;height:68px;border-radius:50%;border:2px solid var(--c,var(--line));background:rgba(34,24,56,.8);color:var(--c,var(--fg));font:900 15px var(--disp);display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 0 10px -2px var(--c,transparent) inset}
.b.d{background:var(--c,var(--line));color:#10091d}
.b.sm{width:52px;height:52px;font-size:12px}
.b.big{width:84px;height:84px}
.b small{font:700 9px var(--ui);display:block;margin-top:-2px}
/* écrans */
.scr{position:absolute;inset:0;z-index:10;background:rgba(11,7,22,.96);display:flex;flex-direction:column;align-items:center;padding:calc(20px + env(safe-area-inset-top,0px)) 16px 20px;overflow-y:auto;touch-action:pan-y}
.scr[hidden]{display:none}
#title{justify-content:center;text-align:center;gap:14px;background:radial-gradient(ellipse at 50% 30%,#2b1450,#0b0716 70%)}
h1{font:900 clamp(26px,9vw,52px)/1 var(--disp);margin:0;color:var(--pink);text-shadow:0 0 18px var(--pink),0 3px 0 #5a0f43;letter-spacing:.04em}
h1 em{display:block;font-style:normal;color:var(--cyan);text-shadow:0 0 18px var(--cyan),0 3px 0 #0b4a63;font-size:.6em;letter-spacing:.3em}
.sub{color:var(--dim);max-width:34ch;margin:0}
.btn{font:900 15px var(--disp);letter-spacing:.1em;text-transform:uppercase;color:#10091d;background:var(--pink);border:0;padding:14px 28px;box-shadow:0 0 18px -2px var(--pink),4px 4px 0 #5a0f43;touch-action:manipulation}
.btn.alt{background:transparent;color:var(--fg);border:2px solid var(--line);box-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#best{color:var(--lime);font-size:12px;min-height:1em}
#select{gap:12px;justify-content:flex-start}
#select h2,#over h2{font:900 16px var(--disp);margin:0;letter-spacing:.1em;text-transform:uppercase;color:var(--cyan)}
#heroGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:100%;max-width:420px}
.hero{background:var(--panel);border:2px solid var(--line);color:var(--fg);padding:6px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font:700 10px var(--ui);touch-action:manipulation;min-width:0}
.hero canvas{width:100%;max-width:48px;aspect-ratio:1;image-rendering:pixelated}
.hero span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.hero.on{border-color:var(--c);box-shadow:0 0 12px -2px var(--c);background:var(--panel2)}
#heroInfo{width:100%;max-width:420px;background:var(--panel);border:2px solid var(--c,var(--line));padding:10px 12px;font-size:13px}
#heroInfo p{margin:6px 0 0}#heroInfo b{color:var(--c);display:block;font:700 11px var(--disp);letter-spacing:.06em;text-transform:uppercase}
.hn{font:900 18px var(--disp);color:var(--c)}.hn small{font:500 11px var(--ui);color:var(--dim);letter-spacing:.05em}
.hp{color:#ff4f6d;letter-spacing:2px;font-size:15px}
.mt{color:var(--dim);font-style:italic}.mt em{color:var(--lime);font-style:normal}
#logo{width:auto;height:auto;max-height:46vh;max-width:min(70vw,300px);aspect-ratio:1;image-rendering:auto;border-radius:10px;box-shadow:0 0 24px #37e0ff44}@media (max-height:520px){#logo{max-height:24vh}#title{gap:6px}#title .sub{font-size:11px}#title #dailyLbl{display:none}}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#over{justify-content:center;text-align:center;gap:12px}
#overTitle{font:900 clamp(20px,6vw,32px)/1.1 var(--disp);margin:0;text-transform:uppercase}
#overTitle.win{color:var(--lime);text-shadow:0 0 14px var(--lime)}#overTitle.lose{color:var(--pink);text-shadow:0 0 14px var(--pink)}
#overStats{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;color:var(--dim)}#overStats b{color:var(--fg)}
#pauseBox{position:absolute;inset:0;z-index:5;background:rgba(11,7,22,.8);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;pointer-events:auto}
#pauseBox[hidden]{display:none}
#mapBox{position:absolute;inset:0;z-index:8;background:rgba(6,3,14,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;pointer-events:auto;padding:8px}
#mapBox[hidden]{display:none}
#mapCv{width:min(96%,calc((100vh - 70px)*1.78));max-height:calc(100% - 52px);aspect-ratio:16/9;image-rendering:pixelated;border:2px solid #4a3a70;background:#0d0818;touch-action:manipulation}
#mapHint{font:600 11px var(--ui);color:#cdb8ee;letter-spacing:.06em}
#radio{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(96%,540px);z-index:7;display:flex;gap:10px;padding:10px;background:rgba(2,20,15,.94);border:2px solid #3dffb0;box-shadow:0 0 22px #3dffb055,inset 0 0 26px #3dffb022;font-family:ui-monospace,Menlo,Consolas,monospace;color:#9dffd6;pointer-events:auto;overflow:hidden;animation:rflk .13s infinite alternate}
#radio[hidden]{display:none}
#radio::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.3) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
@keyframes rflk{from{opacity:.96}to{opacity:1}}
#rPort{flex:none;width:34%;max-width:150px;aspect-ratio:1;image-rendering:pixelated;border:2px solid #3dffb0;background:#021;align-self:flex-start}
#rTxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
#rHead{display:flex;justify-content:space-between;font:700 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.14em;color:#3dffb0;border-bottom:1px solid #3dffb066;padding-bottom:4px}
#rHead i{font-style:normal;color:#ff5c6c;animation:rblk 1s steps(2) infinite}
@keyframes rblk{50%{opacity:0}}
#rBody{font:600 12px/1.45 ui-monospace,Menlo,monospace;min-height:5.8em;text-shadow:0 0 6px #3dffb088}
#rNext{align-self:flex-end;font:700 10px ui-monospace,monospace;color:#3dffb0;animation:rblk .9s steps(2) infinite}
#lvlBox{position:absolute;inset:0;z-index:6;background:rgba(11,7,22,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;pointer-events:auto}
#lvlBox[hidden]{display:none}
#lvlBox h2{font:900 20px var(--disp);margin:0;color:var(--gold,#ffd23a);letter-spacing:.18em}
#lvlSub{font:600 12px var(--ui);color:#cdb8ee}
#lvlOpts{display:flex;gap:8px;max-width:96%;flex-wrap:wrap;justify-content:center}
.up{width:150px;min-height:78px;background:#1b1130;border:2px solid var(--c,#fff);color:#fff;padding:8px 8px 6px;text-align:left;font:600 11px var(--ui);box-shadow:0 0 12px -3px var(--c,#fff);touch-action:manipulation}
.up b{display:block;font:900 12px var(--disp);color:var(--c,#fff);margin-bottom:3px}
.up i{font-style:normal;color:#8a7aa8;float:right}
#pauseBox h2{font:900 20px var(--disp);margin:0;color:var(--cyan);letter-spacing:.2em}
@media (orientation:landscape){
 #app{max-width:none}
 #stage{width:min(100%,calc(100dvh * 16 / 9));max-height:100%;border-bottom:0}
 body.touch #kbhint{display:none}
 #kbhint{display:none}
 #padL{left:max(14px,env(safe-area-inset-left,0px));bottom:max(12px,env(safe-area-inset-bottom,0px))}
 #padR{right:max(14px,env(safe-area-inset-right,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));width:236px}
 .b{width:62px;height:62px;opacity:.78}.b.sm{width:48px;height:48px}.b.big{width:78px;height:78px}
 .bar{bottom:auto;top:4px}
}
@media (orientation:landscape) and (max-height:480px){.scr{padding-top:10px}#title{gap:8px}h1{font-size:30px}#heroGrid{max-width:520px;grid-template-columns:repeat(10,1fr)}}
#diffSeg{display:flex;gap:0;border:2px solid var(--line);width:100%;max-width:420px}
#diffSeg button{flex:1;background:var(--panel);color:var(--dim);border:0;padding:8px 4px;font:700 12px var(--disp);letter-spacing:.06em;text-transform:uppercase;touch-action:manipulation}
#diffSeg button.on{background:var(--cyan);color:#10091d}
.btn.sm{font-size:12px;padding:10px 18px}
.hero{position:relative}.hero.won::after{content:"★";position:absolute;top:1px;right:3px;color:#ffd23a;font-size:11px}
#achList{list-style:none;margin:0;padding:0;width:100%;max-width:420px;display:flex;flex-direction:column;gap:6px}
#achList li{background:var(--panel);border:2px solid var(--line);padding:8px 10px;display:flex;flex-direction:column;gap:1px;opacity:.6}
#achList li.ok{opacity:1;border-color:#ffd23a}#achList li b{font:700 13px var(--ui)}#achList li span{color:var(--dim);font-size:12px}
#achToast{position:absolute;top:8%;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;background:rgba(11,7,22,.92);border:1px solid #ffd23a;padding:4px 12px;font-size:11px;max-width:92%;text-align:center}
#achToast b{color:#ffd23a;font-family:var(--disp);font-size:11px;letter-spacing:.05em}#achToast span{color:var(--dim)}
</style>

  <div id="stage">
    <canvas id="cv" width="320" height="180"></canvas>
    <div id="hud" hidden>
      <div id="banner" hidden></div>

      <div id="achToast" hidden></div>

    <div id="mapBox" hidden><canvas id="mapCv" width="480" height="270"></canvas><div id="mapHint">CARTE · touche pour fermer</div></div>

<script>
/* --- core --- */
/* ===== CORE : constantes, outils, entrées, audio ===== */
const W = 320, H = 180, T = 16, COLS = 20, ROWS = 11;
const TAU = Math.PI * 2;
let _seed = (Date.now() ^ 0x9e3779b9) >>> 0;
function rnd() { // mulberry32
  _seed = (_seed + 0x6D2B79F5) >>> 0;
  let t = _seed; t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const seedRng = n => { _seed = n >>> 0; }, getSeed = () => _seed;
const rr = (a, b) => a + rnd() * (b - a);
const ri = (a, b) => Math.floor(rr(a, b + 1));
const pick = a => a[Math.floor(rnd() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const strip = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[’]/g, "'").toUpperCase();
const hex2rgb = h => { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const rgb2hex = (r, g, b) => '#' + [r, g, b].map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('');
const shade = (h, f) => { const [r, g, b] = hex2rgb(h); return f < 0 ? rgb2hex(r * (1 + f), g * (1 + f), b * (1 + f)) : rgb2hex(r + (255 - r) * f, g + (255 - g) * f, b + (255 - b) * f); };
const aabb = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

/* ---------- Entrées ---------- */
const Input = {
  left: 0, right: 0, jump: 0, fire: 0, ult: 0, shield: 0, repair: 0, pause: 0, dash: 0,
  jumpPressed: 0, ultPressed: 0, shieldPressed: 0, repairPressed: 0, dashPressed: 0,
  mx: 0, my: 0, mouse: false, _prev: {},
  held: {},
  set(k, v) {
    if (v && !this.held[k]) { this[k + 'Pressed'] = 1; }
    this.held[k] = v; this[k] = v ? 1 : 0;
  },
  endFrame() { this.jumpPressed = this.ultPressed = this.shieldPressed = this.repairPressed = this.dashPressed = 0; },
  reset() { for (const k in this.held) this.set(k, 0); this.endFrame(); }
};
const KEYMAP = {
  ArrowLeft: 'left', KeyA: 'left', KeyQ: 'left', ArrowRight: 'right', KeyD: 'right',
  ArrowUp: 'jump', KeyW: 'jump', KeyZ: 'jump', Space: 'jump',
  KeyJ: 'fire', KeyX: 'fire', KeyK: 'ult', KeyE: 'ult', ShiftLeft: 'shield', KeyL: 'shield', KeyR: 'repair', KeyF: 'repair', KeyC: 'dash', KeyV: 'dash'
};

/* ---------- Audio (synthèse WebAudio) ---------- */
const Sound = {
  ctx: null, on: true,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try { const AC = window.AudioContext || window.webkitAudioContext; if (AC) { this.ctx = new AC(); } } catch (e) { }
  },
  tone(f0, f1, dur, type, vol, delay) {
    if (!this.on || !this.ctx) return;
    try {
      const c = this.ctx, t = c.currentTime + (delay || 0);
      const o = c.createOscillator(), g = c.createGain();
      o.type = type || 'square'; o.frequency.setValueAtTime(f0, t);
      o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
      g.gain.setValueAtTime(vol || 0.05, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
    } catch (e) { }
  },
  noise(dur, vol, f) {
    if (!this.on || !this.ctx) return;
    try {
      const c = this.ctx, n = Math.floor(c.sampleRate * dur), b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const s = c.createBufferSource(), g = c.createGain(), fl = c.createBiquadFilter();
      fl.type = 'lowpass'; fl.frequency.value = f || 1200; g.gain.value = vol || 0.08;
      s.buffer = b; s.connect(fl); fl.connect(g); g.connect(c.destination); s.start();
    } catch (e) { }
  },
  play(n) {
    switch (n) {
      case 'shoot': this.tone(720, 260, 0.07, 'square', 0.025); break;
      case 'shootH': this.tone(300, 90, 0.12, 'sawtooth', 0.04); break;
      case 'hit': this.tone(220, 120, 0.05, 'square', 0.03); break;
      case 'kill': this.noise(0.16, 0.07, 1800); this.tone(180, 50, 0.16, 'sawtooth', 0.04); break;
      case 'hurt': this.tone(200, 50, 0.3, 'sawtooth', 0.09); this.noise(0.2, 0.08, 800); break;
      case 'jump': this.tone(260, 520, 0.1, 'square', 0.03); break;
      case 'jump2': this.tone(380, 700, 0.1, 'square', 0.03); break;
      case 'pick': this.tone(520, 1040, 0.09, 'triangle', 0.06); this.tone(780, 1560, 0.1, 'triangle', 0.05, 0.08); break;
      case 'ult': this.tone(120, 900, 0.4, 'sawtooth', 0.07); this.noise(0.3, 0.06, 2500); break;
      case 'boom': this.noise(0.35, 0.12, 900); this.tone(110, 35, 0.3, 'sine', 0.1); break;
      case 'dash': this.noise(0.12, 0.05, 3000); this.tone(500, 900, 0.08, 'sine', 0.03); break;
      case 'crit': this.tone(900, 1500, 0.06, 'square', 0.035); break;
      case 'coin': this.tone(1200, 1800, 0.05, 'square', 0.03); break;
      case 'door': this.tone(300, 600, 0.12, 'triangle', 0.05); this.tone(450, 900, 0.14, 'triangle', 0.05, 0.1); break;
      case 'shield': this.tone(500, 900, 0.15, 'sine', 0.06); break;
      case 'warn': this.tone(880, 880, 0.06, 'square', 0.03); break;
      case 'boss': this.tone(90, 60, 0.8, 'sawtooth', 0.09); this.tone(135, 90, 0.8, 'sawtooth', 0.06); break;
      case 'win': [523, 659, 784, 1047].forEach((f, i) => this.tone(f, f, 0.18, 'square', 0.05, i * 0.13)); break;
      case 'lose': [330, 262, 196, 130].forEach((f, i) => this.tone(f, f * 0.9, 0.25, 'sawtooth', 0.06, i * 0.18)); break;
    }

/* ===== SPRITES : pixel art procédural (tampons RGBA purs, testables sans navigateur) ===== */
class Spr {
  constructor(w, h) { this.w = w; this.h = h; this.d = new Uint8ClampedArray(w * h * 4); this._c = null; this._wc = null; }
  px(x, y, col) {
    if (x < 0 || y < 0 || x >= this.w || y >= this.h) return;
    const [r, g, b] = hex2rgb(col), i = (y * this.w + x) * 4;
    this.d[i] = r; this.d[i + 1] = g; this.d[i + 2] = b; this.d[i + 3] = 255;
  }
  rect(x, y, w, h, col) { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) this.px(x + i, y + j, col); }
  at(x, y) { if (x < 0 || y < 0 || x >= this.w || y >= this.h) return 0; return this.d[(y * this.w + x) * 4 + 3]; }
  outline(col) {
    const [r, g, b] = hex2rgb(col), add = [];
    for (let y = -1; y <= this.h; y++) for (let x = -1; x <= this.w; x++) {
      if (this.at(x, y)) continue;
      if (this.at(x - 1, y) || this.at(x + 1, y) || this.at(x, y - 1) || this.at(x, y + 1)) add.push([x, y]);
    }
    add.forEach(([x, y]) => { if (x >= 0 && y >= 0 && x < this.w && y < this.h) { const i = (y * this.w + x) * 4; this.d[i] = r; this.d[i + 1] = g; this.d[i + 2] = b; this.d[i + 3] = 255; } });
    return this;
  }
  canvas() {
    if (this._c) return this._c;
    if (typeof document === 'undefined') return null;
    const c = document.createElement('canvas'); c.width = this.w; c.height = this.h;
    const x = c.getContext('2d'); if (!x || !x.putImageData) return c;
    x.putImageData(new ImageData(new Uint8ClampedArray(this.d), this.w, this.h), 0, 0);
    return this._c = c;
  }
  white() {
    if (this._wc) return this._wc;
    if (typeof document === 'undefined') return null;
    const c = document.createElement('canvas'); c.width = this.w; c.height = this.h;
    const x = c.getContext('2d'); if (!x || !x.putImageData) return c;
    const d = new Uint8ClampedArray(this.d); for (let i = 0; i < d.length; i += 4) { d[i] = d[i + 1] = d[i + 2] = 255; }
    x.putImageData(new ImageData(d, this.w, this.h), 0, 0);
    return this._wc = c;
  }
}

function drawSheepard(ctx, t, talk, open) {
  const b = sheepBase(t, talk), c = ctx;
  c.clearRect(0, 0, 48, 48);
  if (open < 1) { for (let i = 0; i < 520; i++) { const v = 60 + Math.random() * 195 | 0; c.fillStyle = 'rgb(' + (v * .5 | 0) + ',' + v + ',' + (v * .75 | 0) + ')'; c.fillRect(Math.random() * 48 | 0, Math.random() * 48 | 0, 2, 1); } c.globalAlpha = open * open; }
  const glitch = Math.random() < .05, gy = Math.random() * 44 | 0, gh = 3 + Math.random() * 8 | 0, gd = (Math.random() * 6 | 0) - 3;
  for (let y = 0; y < 48; y++) {
    let dx = Math.round(Math.sin(y * .35 + t * .12) * .6);
    if (glitch && y >= gy && y < gy + gh) dx += gd;
    c.drawImage(b, 0, y, 48, 1, dx, y, 48, 1);
  }
  c.globalAlpha = 1;
  c.globalCompositeOperation = 'multiply'; c.fillStyle = '#c4ffe6'; c.fillRect(0, 0, 48, 48);
  c.globalCompositeOperation = 'source-over';
  c.fillStyle = 'rgba(0,12,8,.22)'; for (let y = 0; y < 48; y += 2) c.fillRect(0, y, 48, 1);

    choosing.forEach((u, i) => { const b = document.createElement('button'); b.className = 'up'; b.style.setProperty('--c', u.col); b.innerHTML = '<i>' + (i + 1) + '</i><b>' + u.name + '</b>' + u.desc; b.onclick = () => pickUp(i); box.appendChild(b); });
    $('lvlBox').hidden = false;
  }
  function pickUp(i) {
    if (!choosing || !choosing[i]) return; const u = choosing[i]; choosing = null;
    game.applyUp(u); $('lvlBox').hidden = true; paused = !!radio; last = 0; Input.reset(); Music.sync();
    if (game.pendingLevel > 0) setTimeout(showLevel, 200);
  }
  /* ---------- Radio du Général Sheepard ---------- */
  let radio = null; const radioQ = [], rctx = $('rPort').getContext('2d'); rctx.imageSmoothingEnabled = false;
  const RADIO = {
    intro: ['Ici le Général Sheepard. Les Prodromes sont plus nombreux que jamais. Ils ont envahi la planète, jusqu\'à nos infrastructures les plus sensibles.', 'Les Mechkawaii sont notre dernière ligne de défense. {h}, tu reprends chaque secteur, un par un... jusqu\'au vaisseau mère.', 'Pas de repli, pilote. Bonne chance.'],
    f1: ['Secteur 1 : les faubourgs. Premiers contacts hostiles. Sankai, leur armurier, tient le carrefour. Nettoie la zone.'],
    f2: ['Faubourgs repris. Beau travail. Le métro est occupé : Senpoku bombarde les quais. Garde la tête froide.'],
    f3: ['Nos relevés montrent des nids sous la ville. Visibilité réduite. Genbu garde l\'entrée, planqué derrière son bouclier.'],
    f4: ['Les Prodromes ont contaminé la jungle. Gaoro chasse en meute. Reste mobile, {h}.'],
    f5: ['Zone critique : réacteur et tours de communication. Si elles tombent, tout tombe. Goki va tout faire sauter, alors fais vite.'],
    f6: ['Le voilà : le vaisseau mère. Goryo y commande l\'invasion. Tout repose sur toi, {h}. Fais-les payer.'],
    boss: ['{b} neutralisé. Le secteur est repris. Récupère ton souffle et prends le portail.'],
    win: ['... Le vaisseau mère s\'effondre ! Tu l\'as fait, {h} !', 'L\'invasion est repoussée. La planète te doit tout, et les Mechkawaii n\'oublieront jamais ce jour.']
  };
  function say(key, extra) {
    const h = game ? game.def.name : 'pilote', b = extra || '';
    radioQ.push((RADIO[key] || []).map(t => t.replace('{h}', h).replace('{b}', b)));
    if (!radio) nextRadio();
  }
  function nextRadio() {
    const lines = radioQ.shift();
    if (!lines) { radio = null; $('radio').hidden = true; if (!paused && !choosing) { last = 0; Input.reset(); Music.sync(); } return; }
    if (!radio) { paused = true; Input.reset(); releaseAll(); Music.stop(); }
    radio = { lines, i: 0, n: 0, t: 0 }; $('radio').hidden = false; $('rBody').textContent = ''; $('rNext').hidden = true;
    Sound.play('door');
  }
  function radioAdvance() {
    if (!radio || radio.t < 14) return;
    const L = radio.lines[radio.i];
    if (radio.n < L.length) { radio.n = L.length; return; }
    if (radio.i < radio.lines.length - 1) { radio.i++; radio.n = 0; $('rNext').hidden = true; }
    else { const wasWin = radio.win; radio = null; $('radio').hidden = true; paused = false; nextRadio(); if (!radio && wasWin) finalOk = true; }
  }
  $('radio').addEventListener('pointerdown', e => { e.preventDefault(); radioAdvance(); });
  let finalOk = false, winSaid = false, lastBoss = 0;
  function radioTick() {
    if (!radio) return;
    radio.t++;
    const talking = radio.t >= 14 && radio.n < radio.lines[radio.i].length;
    if (radio.t >= 14 && talking) {
      const o = Math.floor(radio.n); radio.n += .6;
      if (Math.floor(radio.n) !== o && Math.floor(radio.n) % 3 === 0) { try { Sound.tone(1250 + Math.random() * 300, 1200, .02, 'square', .012); } catch (e) { } }
      $('rBody').textContent = radio.lines[radio.i].slice(0, Math.floor(radio.n));
    } else if (radio.t >= 14) { $('rBody').textContent = radio.lines[radio.i]; }
    $('rNext').hidden = !(radio.t >= 14 && !talking);
    drawSheepard(rctx, radio.t, talking, Math.min(1, radio.t / 14));
  }
  /* ---------- Grande carte ---------- */
  let mapOpen = false; const mctx = $('mapCv').getContext('2d');
  function toggleMap(v) {
    if (!running || !game || choosing || radio) return;
    v = v === undefined ? !mapOpen : v; if (v === mapOpen) return; mapOpen = v; $('mapBox').hidden = !v;
    if (v) { paused = true; Input.reset(); releaseAll(); Music.stop(); drawBigMap(mctx, game); } else { paused = false; last = 0; Input.reset(); Music.sync(); }
  }
  $('btnMap').onclick = () => { audio(); toggleMap(); };
  $('mapBox').addEventListener('pointerdown', e => { e.preventDefault(); toggleMap(false); });
  function setPause(v) { paused = v; $('pauseBox').hidden = !v; Input.reset(); if (v) Music.stop(); else Music.sync(); }
  function audio() { Sound.init(); Music.sync(); }
  function renderAch() {
    $('achList').innerHTML = ACH.map(a => '<li class="' + (ach[a.id] ? 'ok' : '') + '"><b>' + (ach[a.id] ? '★ ' : '☆ ') + a.name + '</b><span>' + a.desc + '</span></li>').join('');
  }

  /* ---------- Sauvegarde (point de contrôle à chaque secteur) ---------- */
  function saveRun() {
    const g = game, p = g.p; if (!g || g.state !== 'play') return;
    lsSet('mkw-ruins-save', { hero: g.def.id, diff: g.diffId, daily: g.daily, floor: g.floor, hp: p.hp, maxhp: p.maxhp, coins: p.coins, keys: p.keys, armor: p.armor, armorMax: p.armorMax, ult: p.ult,
      level: p.level, xp: p.xp, xpNext: p.xpNext, ups: p.ups, items: p.items.map(i => i.id), weapon: p.weapon ? p.weapon.id : null, kills: g.kills, score: g.score, stats: g.stats });
  }
  function restore(s) {
    const g = game, p = g.p;
    while (g.floor < s.floor) g.newFloor();
    for (const id of s.items) { const it = ITEMS.find(i => i.id === id) || WEAPONS.find(i => i.id === id); if (it) { p.items.push(it); it.apply(p, g); } }
    for (const id of (s.ups || [])) { const up = UPGRADES.find(i => i.id === id); if (up) { p.ups.push(id); up.apply(p, g); } }
    if (s.level) { p.level = s.level; p.xp = s.xp || 0; p.xpNext = s.xpNext || 9; }
    g.checkSyn(); g.toast = null;
    if (s.weapon) p.weapon = WEAPONS.find(w => w.id === s.weapon) || null;
    p.maxhp = s.maxhp; p.hp = s.hp; p.coins = s.coins; p.keys = s.keys; p.armor = s.armor == null ? 1 : s.armor; p.armorMax = s.armorMax || 3; p.ult = s.ult;
    g.kills = s.kills; g.score = s.score; Object.assign(g.stats, s.stats, { hurtFloor: false });
    g.banner = 'Partie reprise'; g.bannerT = 120;
  }

  function start(save) {
    if (save) { diffId = save.diff; dailyMode = !!save.daily; }
    game = new Game(save ? save.hero : sel, { diff: diffId, daily: dailyMode ? TODAY : 0 });
    if (save) restore(save);
    lastFloor = 0;
    Input.reset(); running = true; paused = false; acc = 0; last = 0;
    $('pauseBox').hidden = true; $('lvlBox').hidden = true; choosing = null; radio = null; mapOpen = false; $('mapBox').hidden = true; radioQ.length = 0; $('radio').hidden = true; finalOk = false; winSaid = false; lastBoss = 0; $('hud').hidden = false;
    SCR.forEach(s => $(s).hidden = true);
    setShown = false;
  }
  let setShown = false;
  function endScreen(win) {
    if (setShown) return; setShown = true;
    const g = game; lsDel('mkw-ruins-save');
    let rec;
    if (g.daily) { const k = 'mkw-ruins-daily-' + g.daily; rec = Math.max(lsGet(k, 0), g.score); lsSet(k, rec); }
    else { if (g.score > best) { best = g.score; lsSet('mkw-abyss-best', best); } rec = best; }
    if (win) { wins[g.def.id] = (wins[g.def.id] || 0) + 1; lsSet('mkw-ruins-wins', wins); const cardEl = grid.querySelector('[data-id="' + g.def.id + '"]'); if (cardEl) cardEl.classList.add('won'); }
    checkAch();
    $('overTitle').textContent = win ? 'Éclat de victoire' : 'Mechkawaii hors service';
    $('overTitle').className = win ? 'win' : 'lose';
    $('overTxt').textContent = win ? 'Le vaisseau mère est détruit. L\'invasion est repoussée. — Gén. Sheepard' : '« Repli, pilote. Les Mechkawaii tiennent encore. Retourne au front. » — Gén. Sheepard';
    $('overStats').innerHTML = '<span>Secteur <b>' + g.floor + '/6</b></span><span>Prodromes <b>' + g.kills + '</b></span><span>Score <b>' + g.score + '</b></span><span>' + (g.daily ? 'Record du jour' : 'Record') + ' <b>' + rec + '</b></span><span>' + DIFFS[g.diffId].name + '</span>';
    show('over'); Music.stop();
    Sound.play(win ? 'win' : 'lose');
  }
  /* succès */
  let achQueue = [], achT = 0;
  function checkAch() {
    const g = game; if (!g) return;
    for (const a of ACH) if (!ach[a.id]) { let ok = false; try { ok = a.t(g); } catch (e) { } if (ok) { ach[a.id] = 1; lsSet('mkw-ruins-ach', ach); achQueue.push(a); } }
  }
  function tickAch() {
    const el = $('achToast');
    if (achT > 0) { if (--achT === 0) el.hidden = true; return; }
    if (achQueue.length) { const a = achQueue.shift(); el.innerHTML = '<b>★ Succès · ' + a.name + '</b><span>' + a.desc + '</span>'; el.hidden = false; achT = 200; Sound.play('pick'); }
  }

  /* ---------- Clavier / souris ---------- */
  addEventListener('keydown', e => {
    if (radio) { if (!['F5', 'F12'].includes(e.code)) { if (['Enter', 'Space', 'KeyZ', 'KeyX', 'KeyJ', 'KeyK', 'Escape', 'ArrowUp', 'KeyW'].includes(e.code)) { e.preventDefault(); radioAdvance(); } return; } }
    if (mapOpen) { if (['KeyM', 'Escape', 'Enter', 'Space', 'Tab'].includes(e.code)) { e.preventDefault(); toggleMap(false); } return; }
    if (e.code === 'KeyM' && running && !paused) { e.preventDefault(); toggleMap(true); return; }
    if (choosing && ['Digit1', 'Digit2', 'Digit3'].includes(e.code)) { pickUp(+e.code.slice(5) - 1); return; }
    if (e.code === 'Escape' || e.code === 'KeyP') { if (choosing) return; if (running) setPause(!paused); return; }
    if (e.code === 'Enter') { if (!$('title').hidden) $('btnPlay').click(); else if (!$('select').hidden) $('btnGo').click(); else if (!$('over').hidden) $('btnAgain').click(); return; }
    const k = KEYMAP[e.code]; if (!k || !running) return;
    e.preventDefault(); audio(); Input.set(k, 1);
  });
  addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) Input.set(k, 0); });
  addEventListener('blur', () => { Input.reset(); releaseAll(); if (running && !paused && game && game.state === 'play') setPause(true); });
  function toGame(e) {
    const r = cv.getBoundingClientRect();
    Input.mx = (e.clientX - r.left) / r.width * W; Input.my = (e.clientY - r.top) / r.height * H;
  }
  cv.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') { Input.mouse = true; toGame(e); } });
  cv.addEventListener('pointerdown', e => { if (e.pointerType === 'mouse' && running && !paused) { audio(); Input.mouse = true; toGame(e); Input.set('fire', 1); } });
  addEventListener('pointerup', e => { if (e.pointerType === 'mouse') Input.set('fire', 0); });
  addEventListener('keydown', () => { if (Input.mouse) { /* clavier prend la main sur la visée */ } });
  cv.addEventListener('contextmenu', e => e.preventDefault());

  /* ---------- Contrôles tactiles (zones testées à chaque événement : jamais de bouton coincé) ---------- */
  const btns = [...document.querySelectorAll('[data-k]')].map(b => ({ b, k: b.dataset.k, on: false, touch: false, mouse: false }));
  function applyBtn(o) {
    const want = o.touch || o.mouse;
    if (want) { o.b.classList.add('d'); if (!o.on) { o.on = true; Input.mouse = false; audio(); } if (!Input.held[o.k]) Input.set(o.k, 1); }
    else if (o.on) { o.on = false; o.b.classList.remove('d'); Input.set(o.k, 0); }
  }
  function syncTouches(list) {
    for (const o of btns) {
      const r = o.b.getBoundingClientRect(); let hit = false;
      for (let i = 0; i < list.length; i++) { const t = list[i]; if (t.clientX >= r.left - 8 && t.clientX <= r.right + 8 && t.clientY >= r.top - 8 && t.clientY <= r.bottom + 8) { hit = true; break; } }
      o.touch = hit; applyBtn(o);
    }
  }
  function releaseAll() { for (const o of btns) { o.touch = false; o.mouse = false; applyBtn(o); } }
  ['touchstart', 'touchmove', 'touchend', 'touchcancel'].forEach(ev => addEventListener(ev, e => {
    syncTouches(e.touches);
    if (e.target && e.target.closest && e.target.closest('[data-k]')) e.preventDefault();
  }, { passive: false }));
  btns.forEach(o => {
    o.b.addEventListener('pointerdown', e => { if (e.pointerType === 'touch') return; e.preventDefault(); o.mouse = true; applyBtn(o); });
    o.b.addEventListener('contextmenu', e => e.preventDefault());
  });
  addEventListener('pointerup', e => { if (e.pointerType !== 'touch') { for (const o of btns) { o.mouse = false; applyBtn(o); } } });
  addEventListener('pointercancel', e => { if (e.pointerType !== 'touch') releaseAll(); });
  addEventListener('blur', releaseAll);
  document.addEventListener('visibilitychange', () => { if (document.hidden) releaseAll(); });

  /* ---------- Overlays HUD ---------- */
  const elToast = $('toast'), elBanner = $('banner'), elTip = $('tip'), elKb = $('kbhint');
  let lastToast = null, lastBanner = '';
  function updateHud() {
    const g = game;
    const t = g.toast;
    if (t !== lastToast) {
      lastToast = t;
      if (t) { elToast.innerHTML = '<b style="color:' + t.col + '">' + t.title + '</b><span>' + t.desc + '</span>'; elToast.hidden = false; elToast.classList.remove('in'); void elToast.offsetWidth; elToast.classList.add('in'); }
      else elToast.hidden = true;
    }
    const showB = g.bannerT > 0 && g.banner && g.state === 'play';
    if (showB) { if (lastBanner !== g.banner) { lastBanner = g.banner; elBanner.textContent = g.banner; } elBanner.hidden = false; elBanner.style.opacity = Math.min(1, g.bannerT / 30); }
    else { elBanner.hidden = true; lastBanner = ''; }
    let tip = null;
    for (const k of g.pickups) if (k.near && (k.type === 'item' || k.type === 'choice' || k.type === 'shop') && (k.item || k.opt || k.kind)) { tip = k; break; }
    if (tip) {
      const it = tip.item, price = tip.type === 'shop' ? '<span style="color:#ffe38a">▲ Acheter · ' + tip.price + ' boulons (tu as ' + g.p.coins + ')</span>' : '';
      const TXT = { repair: ['#ff5cc8', 'Réparation express', '+2 PV.'], surprod: ['#37e0ff', 'Surproduction', '+2 armure.'], heart: ['#ff5cc8', 'Pack de réparation', '+2 PV.'], key: ['#e8eef0', 'Clé de caisse', 'Ouvre une caisse de loot. Rare !'] };
      const kk = tip.kind || tip.opt, T = TXT[kk];
      const txt = it ? '<b style="color:' + it.col + '">' + it.name + '</b><span>' + it.desc + '</span>' + price : T ? '<b style="color:' + T[0] + '">' + T[1] + '</b><span>' + T[2] + '</span>' + price : '';
      if (elTip.dataset.s !== txt) { elTip.innerHTML = txt; elTip.dataset.s = txt; }
      elTip.hidden = false;
    } else { elTip.hidden = true; elTip.dataset.s = ''; }
  }

  /* ---------- Boucle ---------- */
  const STEP = 1000 / 60;
  function frame(ts) {
    requestAnimationFrame(frame);
    if (!last) last = ts;
    let dt = Math.min(100, ts - last); last = ts;
    for (const o of btns) if ((o.touch || o.mouse) && !Input.held[o.k]) Input.set(o.k, 1);
    radioTick();
    if (running && game) {
      if (!paused) {
        acc += dt;
        let n = 0;
        while (acc >= STEP && n < 5) { game.step(); acc -= STEP; n++; }
        if (acc > STEP * 5) acc = 0;
        if (game.floor !== lastFloor) { const first = !lastFloor; lastFloor = game.floor; saveRun(); if (first && game.floor === 1 && !game.stats.bossKills) say('intro'); say('f' + game.floor); }
        if (game.stats.bossKills > lastBoss) { lastBoss = game.stats.bossKills; if (game.state === 'play') say('boss', BOSSES[Math.min(5, game.floor - 1)].name); }
        if (game.pendingLevel > 0 && game.state === 'play' && !choosing && !radio) showLevel();
        if (game.frame % 30 === 0) checkAch();
        tickAch();
        if (game.state === 'dead' && game.endT > 100) endScreen(false);
        else if (game.state === 'win' && game.endT > 100 && !winSaid) { winSaid = true; say('win'); if (radio) radio.win = true; }
        else if (game.state === 'win' && finalOk) endScreen(true);
      }
      renderGame(ctx, game);
      if (mapOpen) drawBigMap(mctx, game);
      updateHud();
    } else if (game) { renderGame(ctx, game); }
  }
  // fond d'écran titre : étoiles animées légères
  requestAnimationFrame(frame);
  $('best').textContent = best ? 'Record ' + best : '';
  document.addEventListener('visibilitychange', () => { const c = Sound.ctx; if (!c) return; if (document.hidden) { c.suspend(); } else if (!paused) c.resume(); });
  const fsEl = document.documentElement, canFs = !!(fsEl.requestFullscreen || fsEl.webkitRequestFullscreen);
  if (canFs) {
    $('btnFs').hidden = false;
    $('btnFs').onclick = () => { try { const f = document.fullscreenElement || document.webkitFullscreenElement; const p = f ? (document.exitFullscreen || document.webkitExitFullscreen).call(document) : (fsEl.requestFullscreen || fsEl.webkitRequestFullscreen).call(fsEl); if (p && p.catch) p.catch(() => { }); } catch (e) { } };
  }
  const touch = matchMedia('(pointer:coarse)').matches;
  document.body.classList.toggle('touch', touch);
  show('title');
  window.__mkw = { get game() { return game; }, start, select, Input, saveRun, ach, get diffId() { return diffId; } };
})();
</script>
